<h1>Categorías</h1>

<form id="categoriaForm">
    <input
        type="text"
        id="nombreCategoria"
        placeholder="Nombre de la categoría"
        required>

    <button type="submit">
        Guardar
    </button>
</form>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Acciones</th>
        </tr>
    </thead>

    <tbody id="tablaCategorias">

    </tbody>
</table>
<div id = "modalCategoria" class = "modal">
    <div class = "modal-content">
        <span>
            <h2>Editar Categoria</h2>
            <input type="text" id="editarCategoria">
            <button onclick="guardarEdicionCategoria">Guardar</button>    
        </span>
    </div>
</div>
